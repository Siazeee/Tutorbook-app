<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Tutorbook</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tutorbook">
<meta name="theme-color" content="#0A0F1C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  color-scheme: dark;
  --bg:#0A0F1C; --card:#121A2C; --card-2:#18223A; --field:#0D1424; --ink:#F4EEE3; --ink-2:#A9B0C2; --ink-3:#6E7790; --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --gold:#D8B36A; --gold-2:#F0D49A; --gold-soft:rgba(216,179,106,.13); --gold-line:rgba(216,179,106,.35);
  --brand:var(--gold); --brand-ink:#17120A; --brand-soft:var(--gold-soft);
  --mint:#5FCFA6; --mint-soft:rgba(95,207,166,.13); --mint-ink:#06231A;
  --amber:#E9B35E; --amber-soft:rgba(233,179,94,.13); --coral:#EE7D7D; --coral-soft:rgba(238,125,125,.13);
  --wa:#1DAA61; --wa-bubble:#005C4B; --wa-bg:#0B141A; --wa-ink:#E9EDEF;
  --serif: ui-serif, "New York", "Iowan Old Style", "Palatino", Georgia, serif;
  --text: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --display: var(--serif);
  --sh-1: 0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px -16px rgba(0,0,0,.8);
  --sh-2: 0 24px 50px -20px rgba(0,0,0,.9);
  --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior-y:none;
  background:radial-gradient(900px 520px at 90% -12%, rgba(216,179,106,.10), transparent 62%), radial-gradient(700px 500px at -10% 30%, rgba(96,120,200,.07), transparent 60%), var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:1.5px solid var(--gold);outline-offset:3px;border-radius:10px}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:600;letter-spacing:-.01em}
.app{max-width:600px;margin:0 auto;padding:calc(var(--sat) + 16px) 18px calc(var(--sab) + 124px)}
.muted{color:var(--ink-3)} .sub{color:var(--ink-2)} .small{font-size:13.5px}
svg.i{width:18px;height:18px;flex:none}
svg.i *{stroke-width:1.6}

/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 2px 18px}
.topbar .hello{color:var(--gold);font-weight:500;font-size:14.5px;letter-spacing:.01em}
.topbar h1{font-size:32px}
.round-btn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--ink-2);flex:none}
.round-btn svg{width:20px;height:20px}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 20px 18px;color:var(--ink);isolation:isolate;border:1px solid var(--gold-line);
  background:radial-gradient(120% 100% at 105% -5%, rgba(216,179,106,.24), transparent 52%), linear-gradient(165deg,#1A2440 0%,#111A2E 60%,#0E1628 100%);box-shadow:var(--sh-2)}
.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;background:repeating-linear-gradient(115deg, rgba(255,255,255,.018) 0 2px, transparent 2px 9px);pointer-events:none}
.hero .date{font-weight:500;font-size:14px;color:var(--gold);letter-spacing:.02em}
.hero .big{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.08;margin:6px 0 6px;letter-spacing:-.015em}
.hero .line{font-size:15px;color:var(--ink-2)}
.hero .bar{display:flex;gap:4px;margin:16px 0 2px}
.hero .bar i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.1)}
.hero .bar i.on{background:linear-gradient(90deg,var(--gold),var(--gold-2))}
.next{display:flex;align-items:center;gap:12px;width:100%;margin-top:16px;padding:12px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--line-2);color:var(--ink)}
.next .k{font-size:12.5px;font-weight:600;color:var(--gold)}
.next .t{font-family:var(--serif);font-weight:600;font-size:18px}
.next .m{font-size:13.5px;color:var(--ink-2)}
.next .go{margin-left:auto;width:34px;height:34px;border-radius:12px;background:var(--gold);color:var(--brand-ink);display:grid;place-items:center;flex:none}

/* Subject glyph */
.glyph{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:16px;flex:none;color:var(--c);
  background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 35%,transparent)}
.glyph.sm{width:30px;height:30px;border-radius:10px;font-size:13px}

/* Week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.wd .d{font-size:11.5px;font-weight:600;color:var(--ink-3)}
.wd .n{font-family:var(--serif);font-size:20px;font-weight:600}
.wd .dots{display:flex;gap:2px;height:5px}
.wd .dots i{width:5px;height:5px;border-radius:3px;background:var(--c)}
.wd.today .n{color:var(--gold)}
.wd.sel{background:var(--gold-soft);border-color:var(--gold-line)}
.wd.sel .d{color:var(--gold)} .wd.sel .n{color:var(--gold-2)}

/* Sections */
.sec{display:flex;align-items:center;justify-content:space-between;margin:30px 2px 12px;gap:10px}
.sec h2{font-size:21px}
.sec .link{color:var(--gold);font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:4px}
.sec .arrows{display:flex;gap:6px}
.mini-btn{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--ink-2)}

/* Lesson card */
.lcard{display:grid;grid-template-columns:78px 1fr;width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:10px;text-align:left;box-shadow:var(--sh-1)}
.lcard .lt{background:color-mix(in srgb,var(--c) 9%,var(--card));border-right:1px solid color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 4px;gap:1px}
.lcard .lt b{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1}
.lcard .lt span{font-size:12px;font-weight:600;opacity:.85}
.lcard .lt .ld{font-size:11.5px;font-weight:700;white-space:nowrap;margin-bottom:5px;padding:2px 7px;border-radius:7px;background:color-mix(in srgb,var(--c) 16%,transparent);opacity:1}
.lcard .lt small{font-size:11.5px;font-weight:500;opacity:.7;margin-top:4px}
.lcard .lb{padding:13px 14px;min-width:0}
.lcard .nm{font-family:var(--serif);font-weight:600;font-size:18px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.lcard .nm span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:5px;color:var(--ink-2);font-size:13.5px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta svg{width:14px;height:14px;opacity:.75}
.sdot{width:7px;height:7px;border-radius:4px;background:var(--c);display:inline-block;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 20%,transparent)}
.lcard.cancelled{opacity:.5}
.lcard.cancelled .nm span:first-child{text-decoration:line-through}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:rgba(255,255,255,.06);color:var(--ink-2);border:1px solid var(--line)}
.pill svg{width:12px;height:12px}
.pill.mint{background:var(--mint-soft);color:var(--mint);border-color:transparent} .pill.amber{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.pill.coral{background:var(--coral-soft);color:var(--coral);border-color:transparent} .pill.brand{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}

/* Cards & rows */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--sh-1)}
.card.pad{padding:16px}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left;background:transparent}
.row + .row{border-top:1px solid var(--line)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600}
.row .d{color:var(--ink-2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--ink-3);width:18px;height:18px;flex:none}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:600;flex:none;font-size:15px;color:var(--c);
  background:color-mix(in srgb,var(--c) 12%,var(--card));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent)}
.av.lg{width:66px;height:66px;font-size:24px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent),0 0 0 4px rgba(216,179,106,.18)}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.ic.amber{background:var(--amber-soft);color:var(--amber)} .ic.brand{background:var(--gold-soft);color:var(--gold)} .ic.mint{background:var(--mint-soft);color:var(--mint)} .ic.coral{background:var(--coral-soft);color:var(--coral)}
.cta{font-size:13px;font-weight:600;padding:7px 13px;border-radius:999px;background:var(--gold-soft);color:var(--gold);white-space:nowrap;border:1px solid var(--gold-line)}
.cta.wa{background:var(--wa);color:#fff;border-color:transparent}

/* Exams */
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -18px;padding:2px 18px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.exam{scroll-snap-align:start;min-width:150px;max-width:170px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;text-align:left;flex:none;position:relative;overflow:hidden}
.exam::before{content:"";position:absolute;left:0;top:0;right:0;height:2px;background:var(--c)}
.exam .n{font-family:var(--serif);font-size:36px;font-weight:600;line-height:1;color:var(--c)}
.exam .u{font-size:12.5px;font-weight:500;color:var(--ink-2);margin-top:2px}
.exam .w{font-family:var(--serif);font-weight:600;font-size:16px;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exam .s{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Fees */
.fee-sum{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.fee-sum b{font-family:var(--serif);font-size:30px;font-weight:600}
.prog{height:6px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;margin:14px 0 8px}
.prog i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold-2));transition:width .4s}
.legend{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)}

/* Banner / empty */
.banner{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--gold-line);border-radius:18px;padding:12px 14px;margin-bottom:16px;font-size:14.5px}
.empty{text-align:center;padding:32px 22px 26px;color:var(--ink-2)}
.empty h3{color:var(--ink);font-size:23px;margin:14px 0 6px}
.empty p{margin:0 auto;max-width:30ch}
.soft-empty{padding:18px;text-align:center;color:var(--ink-3);font-size:14.5px;border-radius:20px;border:1px dashed var(--line-2)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border-radius:16px;font-weight:600;font-size:16px;text-align:center;letter-spacing:.01em;
  background:linear-gradient(180deg,#E6C483,#C9A04F);color:var(--brand-ink);box-shadow:0 10px 24px -12px rgba(216,179,106,.6), inset 0 1px 0 rgba(255,255,255,.35)}
.btn.soft{background:var(--gold-soft);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-line)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.danger{background:var(--coral-soft);color:var(--coral);box-shadow:none}
.btn.wa{background:var(--wa);color:#fff;box-shadow:0 10px 24px -12px rgba(29,170,97,.7)}
.btn.mint{background:linear-gradient(180deg,#78DDB7,#4DBF95);color:var(--mint-ink);box-shadow:0 10px 24px -12px rgba(95,207,166,.6), inset 0 1px 0 rgba(255,255,255,.3)}
.btn.block{width:100%}
.btn.sm{height:38px;padding:0 14px;font-size:14.5px;border-radius:12px}
.btn:active,.tile:active,.lcard:active,.wd:active,.scard:active{transform:scale(.985)}
.btn[disabled]{opacity:.45}
.btns{display:flex;gap:10px} .btns > *{flex:1}
.textlink{color:var(--coral);font-weight:600;font-size:15px;display:block;margin:22px auto 4px;padding:8px}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:13px 4px 11px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.tile svg{width:22px;height:22px;color:var(--gold)}
.tile.wa svg{color:#3DDC84} .tile.danger svg{color:var(--coral)}

/* Segmented */
.seg{display:flex;background:var(--field);border-radius:14px;padding:4px;gap:4px;border:1px solid var(--line)}
.seg button{flex:1;height:36px;border-radius:10px;font-weight:600;font-size:14px;color:var(--ink-3);text-align:center}
.seg button.on{background:var(--card-2);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-line)}

/* Calendar */
.cal{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:12px 8px}
.cal-top{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 12px}
.cal-top h2{font-size:21px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{font-size:11.5px;font-weight:600;color:var(--ink-3);text-align:center;padding:2px 0 6px}
.day{aspect-ratio:1/1.05;border-radius:14px;display:flex;flex-direction:column;align-items:center;padding-top:6px;gap:3px}
.day .n{font-family:var(--serif);font-weight:500;font-size:17px;width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
.day.out .n{color:var(--ink-3);opacity:.5}
.day.today .n{color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.day.sel .n{background:linear-gradient(180deg,#E6C483,#C9A04F);color:var(--brand-ink);box-shadow:none;font-weight:600}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:5px;height:5px;border-radius:3px;background:var(--c)}

/* Tab bar */
.tabbar{position:fixed;left:14px;right:14px;bottom:calc(var(--sab) + 10px);z-index:30;max-width:520px;margin:0 auto;border-radius:26px;background:rgba(16,23,40,.82);backdrop-filter:saturate(1.6) blur(22px);-webkit-backdrop-filter:saturate(1.6) blur(22px);border:1px solid var(--line-2);box-shadow:var(--sh-2);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--ink-3);font-size:11px;font-weight:600}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--gold)}
.tab-add{justify-self:center;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--brand-ink);background:linear-gradient(180deg,#EACB8E,#C69C4B);box-shadow:0 10px 26px -10px rgba(216,179,106,.75), inset 0 1px 0 rgba(255,255,255,.4)}
.tab-add svg{width:24px;height:24px}
.tab-add svg *{stroke-width:2.4}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(3,5,12,.6);z-index:40;opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:calc(100vh - var(--sat) - 14px);max-height:calc(100dvh - var(--sat) - 14px);background:#0D1322;border:1px solid var(--line-2);border-bottom:0;border-radius:28px 28px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .36s cubic-bezier(.2,.85,.2,1);max-width:600px;margin:0 auto;box-shadow:0 -20px 50px rgba(0,0,0,.6);overflow:hidden}
.sheet.show{transform:none}
.sh-head{display:flex;align-items:center;gap:10px;padding:16px 14px 8px 20px;flex:none}
.sh-head h3{flex:1;font-size:21px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-head .x{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card-2);border:1px solid var(--line);color:var(--ink-2)}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 18px 26px;flex:1}
.sh-foot{flex:none;padding:12px 18px calc(var(--sab) + 12px);background:#0D1322;border-top:1px solid var(--line)}
.sheet.has-hero .sh-head{position:absolute;top:0;right:0;left:auto;z-index:2;padding:12px}
.sheet.has-hero .sh-head h3{display:none}
.sheet.has-hero .sh-head .x{background:rgba(10,15,28,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sheet.has-hero .sh-body{padding-top:0}
@media (prefers-reduced-motion: reduce){.sheet,.scrim{transition:none}}

.s-hero{margin:0 -18px 16px;padding:24px 20px 20px;color:var(--ink);position:relative;overflow:hidden;isolation:isolate;border-bottom:1px solid var(--line);
  background:radial-gradient(110% 120% at 100% 0%, color-mix(in srgb,var(--c) 30%,transparent), transparent 55%), linear-gradient(170deg,#18223A,#0D1322)}
.s-hero .glyph{width:46px;height:46px;font-size:18px}
.s-hero h2{font-size:27px;margin-top:12px;padding-right:44px}
.s-hero .kv{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:15px;color:var(--ink-2)}
.s-hero .kv span{display:flex;align-items:center;gap:9px}
.s-hero .kv svg{width:16px;height:16px;color:var(--gold)}
.s-hero .pills .pill{background:rgba(255,255,255,.06);color:var(--ink)}

/* Steps */
.step{display:flex;align-items:center;gap:10px;margin:26px 2px 10px}
.step .num{width:28px;height:28px;border-radius:50%;border:1px solid var(--gold-line);color:var(--gold);display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:15px}
.step .num.done{background:var(--mint-soft);border-color:transparent;color:var(--mint)}
.step h3{font-size:19px;flex:1}
.step .hint{font-size:13px;color:var(--ink-3)}
.label{font-size:13px;font-weight:600;color:var(--ink-3);margin:20px 4px 8px;display:block;letter-spacing:.02em}

/* Attendance */
.att{display:flex;align-items:center;gap:10px;padding:11px 12px}
.att + .att{border-top:1px solid var(--line)}
.att .nm{flex:1;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-opts{display:flex;gap:6px}
.att-b{display:flex;flex-direction:column;align-items:center;gap:2px;width:58px;padding:8px 0 6px;border-radius:13px;font-size:11.5px;font-weight:600;color:var(--ink-3);background:var(--field);border:1px solid var(--line)}
.att-b svg{width:18px;height:18px}
.att-b.on.p{background:var(--mint-soft);color:var(--mint);border-color:color-mix(in srgb,var(--mint) 50%,transparent)}
.att-b.on.l{background:var(--amber-soft);color:var(--amber);border-color:color-mix(in srgb,var(--amber) 50%,transparent)}
.att-b.on.a{background:var(--coral-soft);color:var(--coral);border-color:color-mix(in srgb,var(--coral) 50%,transparent)}

/* Forms */
.field{display:block;margin-bottom:12px}
.field > span{display:block;font-size:13px;font-weight:600;color:var(--ink-3);margin:0 0 6px 4px;letter-spacing:.01em}
.input{width:100%;min-width:0;background:var(--field);border:1px solid var(--line-2);border-radius:14px;padding:12px 13px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none;color:var(--ink)}
.input::placeholder{color:#5A6380}
textarea.input{resize:none;min-height:76px;line-height:1.5}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
input[type=date].input,input[type=time].input,input[type=month].input{min-height:49px;padding-left:10px;padding-right:8px}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;background:var(--field);border:1px solid var(--line-2);font-weight:500;font-size:14.5px;cursor:pointer;user-select:none;color:var(--ink-2)}
.chip svg{width:14px;height:14px}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip .dot{width:7px;height:7px;border-radius:4px;background:var(--c,var(--gold))}
.chip.on,.chip:has(input:checked){background:var(--gold-soft);border-color:var(--gold);color:var(--gold-2)}
.chip:has(input:focus-visible){outline:1.5px solid var(--gold);outline-offset:2px}
.form-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 14px 4px;margin-bottom:12px}
.fc-title{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-weight:600;font-size:18px;margin:0 2px 14px}
.fc-title svg{color:var(--gold)}
.hint{font-size:13px;color:var(--ink-3);margin:-4px 4px 12px}

/* Include toggles */
.inc{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font-weight:500;font-size:13.5px;background:var(--field);border:1px solid var(--line-2);color:var(--ink-3)}
.inc svg{width:13px;height:13px;display:none}
.inc.on{background:var(--gold-soft);color:var(--gold-2);border-color:var(--gold-line)}
.inc.on svg{display:block}

/* WhatsApp preview (WhatsApp dark mode) */
.wa-frame{border-radius:22px;overflow:hidden;margin-top:16px;border:1px solid var(--line-2)}
.wa-top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#1F2C34;color:#E9EDEF}
.wa-top .av{width:34px;height:34px;font-size:13px;--c:#25D366}
.wa-top b{display:block;font-size:15px;font-weight:600} .wa-top small{color:#8696A0;font-size:12.5px}
.wa-body{background:var(--wa-bg);padding:14px 12px 16px;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:14px 14px}
.bubble{position:relative;margin-left:auto;max-width:94%;background:var(--wa-bubble);color:var(--wa-ink);border-radius:14px 4px 14px 14px}
.bubble textarea{display:block;width:100%;border:0;background:transparent;color:inherit;resize:none;padding:10px 12px 22px;font-size:15px;line-height:1.45;outline:none;min-height:260px;font-family:var(--text)}
.bubble .tm{position:absolute;right:10px;bottom:5px;font-size:11px;color:#8BB8AE}
.tools{display:flex;gap:8px;margin-top:10px}
.tools button{flex:1;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink-2)}
.tools svg{width:16px;height:16px;color:var(--gold)}

/* Search */
.search{position:relative;margin-bottom:14px;display:block}
.search .input{padding-left:42px;background:var(--card);border-color:var(--line)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3)}

/* Student cards */
.scard{display:flex;align-items:center;gap:13px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:13px 14px;margin-bottom:10px;text-align:left;box-shadow:var(--sh-1)}
.scard .grow{flex:1;min-width:0}
.scard .t{font-family:var(--serif);font-weight:600;font-size:18px}
.scard[disabled]{opacity:.5}

/* Settings */
.set-row{display:flex;align-items:center;gap:12px;padding:13px 16px}
.set-row + .set-row{border-top:1px solid var(--line)}
.set-row b{font-weight:600}

/* Dialog / toast */
.dlg-scrim{position:fixed;inset:0;background:rgba(3,5,12,.65);z-index:70;display:grid;place-items:center;padding:24px}
.dlg{background:#141C30;border:1px solid var(--line-2);border-radius:24px;max-width:340px;width:100%;padding:22px 18px 14px;box-shadow:0 30px 70px rgba(0,0,0,.6)}
.dlg p{margin:0 0 16px;font-size:16px;line-height:1.5;text-align:center}
.dlg .btn{width:100%;margin-top:8px}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 12px);transform:translate(-50%,-20px);background:#F4EEE3;color:#141006;padding:11px 18px;border-radius:16px;font-weight:600;font-size:15px;opacity:0;transition:all .25s;z-index:80;pointer-events:none;max-width:88vw;text-align:center;box-shadow:var(--sh-2)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.progress{height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
</style>
</head>
<body>
<main class="app" id="main" aria-live="polite"></main>
<nav class="tabbar" id="tabs" aria-label="Main"></nav>
<div id="sheets"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
"use strict";
/* ---------- Storage ---------- */
const KEY = 'tutorbook.v1';
const DEFAULT = () => ({
  v:1,
  settings:{ tutorName:'', signOff:'', country:'65', currency:'S$', tone:'report', engine:'compose', llmModel:'Qwen2.5-0.5B-Instruct-q4f16_1-MLC', onboarded:false, autoLevel:true, levelYear:0, hideInstall:false },
  students:[], lessons:[], payments:[]
});
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || DEFAULT(); } catch(e){ S = DEFAULT(); }
S.settings = Object.assign(DEFAULT().settings, S.settings||{});
['students','lessons','payments'].forEach(k=>{ if(!Array.isArray(S[k])) S[k]=[]; });
S.students.forEach(s=>{ if(s.rateType!=='month') s.rateType='hour'; });
if(!S.settings.aiProvider) S.settings.aiProvider = S.settings.engine==='llm' ? 'webllm' : 'none';
if(!S.settings.reportMigrated){ S.settings.tone='report'; S.settings.reportMigrated=true; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('Could not save — storage is full'); } }
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

/* ---------- Utils ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid = ()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const today = () => ds(new Date());
const addDays = (s,n) => { const d=pd(s); d.setDate(d.getDate()+n); return ds(d); };
const ym = s => s.slice(0,7);
const addMonths = (m,n) => { const [y,mm]=m.split('-').map(Number); const d=new Date(y,mm-1+n,1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOWL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const fmtDate = (s,long) => { const d=pd(s); return long ? `${DOWL[d.getDay()]}, ${d.getDate()} ${MONL[d.getMonth()]}` : `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const fmtMonth = m => { const [y,mm]=m.split('-').map(Number); return `${MONL[mm-1]} ${y}`; };
const fmtTime = t => { if(!t) return ''; let [h,m]=t.split(':').map(Number); const ap=h>=12?'pm':'am'; h=h%12||12; return `${h}:${pad(m)} ${ap}`; };
const toMin = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };
const fromMin = n => `${pad(Math.floor(n/60)%24)}:${pad(n%60)}`;
const endTime = l => fromMin(toMin(l.start)+(+l.dur||60));
const daysBetween = (a,b) => Math.round((pd(b)-pd(a))/86400000);
const durLabel = m => { m=+m; const h=Math.floor(m/60), r=m%60; return h? (r? `${h}h ${r}m` : `${h}h`) : `${r}m`; };
const money = n => { n=Math.round((+n||0)*100)/100; return `${S.settings.currency}${n.toLocaleString('en-SG',Number.isInteger(n)?{maximumFractionDigits:0}:{minimumFractionDigits:2,maximumFractionDigits:2})}`; };
const firstName = n => (n||'').trim().split(/\s+/)[0] || 'your child';
const initials = n => (n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
function choose(msg, buttons){
  return new Promise(res=>{
    const w=document.createElement('div'); w.className='dlg-scrim';
    w.innerHTML=`<div class="dlg" role="alertdialog" aria-modal="true"><p>${esc(msg)}</p>${buttons.map((b,i)=>`<button class="btn ${b.cls||''}" data-i="${i}">${esc(b.label)}</button>`).join('')}<button class="btn ghost" data-i="-1">${esc(buttons.cancel||'Cancel')}</button></div>`;
    w.addEventListener('click',e=>{ const b=e.target.closest('[data-i]'); if(!b && e.target!==w) return; w.remove(); res(b?+b.dataset.i:-1); });
    document.body.appendChild(w); w.querySelector('.btn').focus();
  });
}
const ask = async (msg, ok='OK', cls='') => (await choose(msg,[{label:ok,cls}]))===0;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }


const stu = id => S.students.find(s=>s.id===id);
const lessonById = id => S.lessons.find(l=>l.id===id);
const sortL = (a,b) => (a.date+a.start).localeCompare(b.date+b.start);
const lessonsOn = d => S.lessons.filter(l=>l.date===d).sort(sortL);
const lessonsFor = sid => S.lessons.filter(l=>l.studentIds.includes(sid)).sort(sortL);
const lessonTitle = l => l.title || l.studentIds.map(id=>stu(id)?.name).filter(Boolean).join(', ') || 'Lesson';
const nowKey = () => { const d=new Date(); return today()+fromMin(d.getHours()*60+d.getMinutes()); };
const isPast = l => (l.date+endTime(l)) <= nowKey();
function nextLessonFor(sid, after){
  const key = after ? after.date+after.start : nowKey();
  return lessonsFor(sid).find(l=>l.status!=='cancelled' && (l.date+l.start) > key && (!after || l.id!==after.id));
}
function upcomingExams(sid, from, within){
  const out=[]; S.students.forEach(s=>{ if(sid && s.id!==sid) return; (s.exams||[]).forEach(e=>{ const d=daysBetween(from,e.date); if(d>=0 && d<=within) out.push({...e,days:d,student:s}); }); });
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
/* Fees */
function feeHours(s, m){ const ls = S.lessons.filter(l=>l.studentIds.includes(s.id) && ym(l.date)===m && l.status!=='cancelled' && (l.attendance?.[s.id]!=='absent')); return {n:ls.length, mins:ls.reduce((a,l)=>a+(+l.dur||0),0)}; }
const hrsLabel = mins => { const h=Math.round(mins/60*100)/100; return `${h} hour${h===1?'':'s'}`; };
function feeDue(s, m){
  if(!s.rate) return 0;
  if(s.rateType==='month') return S.lessons.some(l=>l.studentIds.includes(s.id) && ym(l.date)===m && l.status!=='cancelled') ? +s.rate : 0;
  return Math.round(feeHours(s,m).mins/60*(+s.rate)*100)/100;
}
const feePaid = (sid,m) => S.payments.filter(p=>p.studentId===sid && p.month===m).reduce((a,p)=>a+(+p.amount||0),0);
const payPlan = s => Object.assign({type:'day', day:1, when:'same'}, s.pay||{});
function feeDueDate(s, m){
  const p = payPlan(s);
  if(p.type==='first' || p.type==='last'){
    const ls = S.lessons.filter(l=>l.studentIds.includes(s.id) && ym(l.date)===m && l.status!=='cancelled').sort(sortL);
    const l = p.type==='first' ? ls[0] : ls[ls.length-1]; return l ? l.date : null;
  }
  const mm = p.when==='next' ? addMonths(m,1) : m; const [y,mo] = mm.split('-').map(Number);
  return `${mm}-${pad(Math.min(Math.max(1,+p.day||1), new Date(y,mo,0).getDate()))}`;
}
const ordinal = n => n + (n%100>=11&&n%100<=13 ? 'th' : ({1:'st',2:'nd',3:'rd'})[n%10]||'th');
function planLabel(s){ const p=payPlan(s);
  if(p.type==='first') return 'at the first lesson of the month';
  if(p.type==='last') return 'at the last lesson of the month';
  return `on the ${ordinal(+p.day||1)}${p.when==='next'?' of the following month':''}`; }
function feeStatus(s,m){
  const due=feeDue(s,m), paid=feePaid(s.id,m), dueDate=feeDueDate(s,m);
  const b = {due, paid, dueDate, days: dueDate ? daysBetween(today(), dueDate) : null};
  if(due<=0 && paid<=0) return {...b, key:'none', label:'No fees'};
  if(paid>=due) return {...b, key:'paid', label:'Paid'};
  if(b.days!==null && b.days<0) return {...b, key:'overdue', label:'Overdue'};
  if(paid>0) return {...b, key:'part', label:'Part paid'};
  const short = d => { const x=pd(d); return `${x.getDate()} ${MON[x.getMonth()]}`; };
  return {...b, key:'unpaid', label: dueDate ? (b.days===0?'Due today':b.days===1?'Due tomorrow':`Due ${short(dueDate)}`) : 'Unpaid'};
}
const owing = f => ['unpaid','part','overdue'].includes(f.key);
const feePill = f => f.key==='none' ? '' : `<span class="pill ${f.key==='paid'?'mint':f.key==='overdue'?'coral':f.key==='part'||(f.days!==null&&f.days<=3)?'amber':''}">${f.key==='paid'?I.check:''}${f.label}</span>`;
const dueWords = f => { if(!f.dueDate) return 'are due'; const x=pd(f.dueDate), dm=`${x.getDate()} ${MONL[x.getMonth()]}`;
  return f.days<0 ? `were due on ${dm}` : f.days===0 ? 'are due today' : f.days===1 ? 'are due tomorrow' : `are due on ${dm}`; };
function feeReminder(s, m){
  const f = feeStatus(s,m), owe = f.due-f.paid, mon = MONL[+m.slice(5)-1];
  const fh = s.rateType!=='month' && s.rate ? feeHours(s,m) : null;
  const out = [s.parentName?`Hi ${s.parentName},`:'Hi,',
    `A gentle reminder that ${firstName(s.name)}'s tuition fees for ${mon}${fh&&fh.n?` (${fh.n} lesson${fh.n>1?'s':''}, ${hrsLabel(fh.mins)} at ${money(s.rate)} per hour)`:''} ${dueWords(f)}. The amount ${f.paid>0?'remaining ':''}is ${money(owe)}${f.paid>0?`, as ${money(f.paid)} has been received`:''}.`,
    'Thank you!'];
  const sign = S.settings.signOff || S.settings.tutorName; if(sign) out.push(sign);
  return out.join('\n\n');
}

/* ---------- Subjects ---------- */
const SUBJ = [
  [/a[\s-]?math|add(itional)? math/i,'#B79CFF','∑'],
  [/math|maths/i,'#8FA8FF','×'],
  [/sci|physics|chem|bio/i,'#6FD3B6','Sc'],
  [/eng|english|gp|literature/i,'#F29AB7','Aa'],
  [/chinese|mandarin|华文|中文/i,'#F2A271','中'],
  [/malay|tamil/i,'#E39BE0','Bm'],
  [/program|coding|scratch|python|c#|c\+\+|react|java/i,'#EBC56E','</>'],
];
const subj = s => { for(const [re,c,g] of SUBJ) if(re.test(s||'')) return {c,g}; return {c:'#9AA3B8',g:'✎'}; };
const subjectColor = s => subj(s).c;
const glyph = (s, cls='') => { const m=subj(s); return `<span class="glyph ${cls}" style="--c:${m.c}">${esc(m.g)}</span>`; };
const avatar = (st, cls='') => `<span class="av ${cls}" style="--c:${subjectColor(st?.subject)}">${esc(initials(st?.name))}</span>`;

/* ---------- Icons ---------- */
const sv = (p, w=2) => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  home: sv('<path d="M3.5 10.5L12 3.8l8.5 6.7"/><path d="M5.5 9v10.2a1.3 1.3 0 001.3 1.3H10v-5.5h4v5.5h3.2a1.3 1.3 0 001.3-1.3V9"/>'),
  cal: sv('<rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>'),
  users: sv('<circle cx="9" cy="8.5" r="3.5"/><path d="M2.8 19.5c.8-3.3 3.3-5 6.2-5s5.4 1.7 6.2 5"/><path d="M15.5 5.3a3.4 3.4 0 010 6.4M18 14.8c1.6.7 2.8 2.3 3.2 4.7"/>'),
  wallet: sv('<path d="M4 7.5A2.5 2.5 0 016.5 5H18v3"/><rect x="3.5" y="7.5" width="17" height="12" rx="3"/><circle cx="16" cy="13.5" r="1.2" fill="currentColor"/>'),
  plus: sv('<path d="M12 5v14M5 12h14"/>',2.6),
  gear: sv('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.6 1.6 0 00-1-1.5 1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H3a2 2 0 110-4h.1a1.6 1.6 0 001.5-1 1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V3a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H21a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/>',1.8),
  clock: sv('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'),
  pin: sv('<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0113 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>'),
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',
  left: sv('<path d="M15 6l-6 6 6 6"/>',2.4), right: sv('<path d="M9 6l6 6-6 6"/>',2.4),
  x: sv('<path d="M6 6l12 12M18 6L6 18"/>',2.4),
  search: sv('<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/>',2.2),
  check: sv('<path d="M5 12.5l4.5 4.5L19 7.5"/>',2.6),
  late: sv('<circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2 1.5M9.5 2.8h5"/>'),
  absent: sv('<circle cx="12" cy="12" r="8.5"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/>'),
  edit: sv('<path d="M4 20h4L19 9a2.8 2.8 0 00-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>'),
  move: sv('<rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4M10 15.5h5M13 13.5l2 2-2 2"/>'),
  ban: sv('<circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/>'),
  undo: sv('<path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/>'),
  note: sv('<path d="M6 3.5h9l4 4v13H6z"/><path d="M14.5 3.5v4.5H19M9 12.5h7M9 16h5"/>'),
  send: sv('<path d="M4 12l16-8-6 16-2.5-6.5z"/>'),
  flag: sv('<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>'),
  money: sv('<rect x="3" y="6" width="18" height="12" rx="3"/><circle cx="12" cy="12" r="2.5"/>'),
  user: sv('<circle cx="12" cy="8" r="4"/><path d="M4.5 20c1-3.8 4-5.5 7.5-5.5s6.5 1.7 7.5 5.5"/>'),
  phone: sv('<path d="M5 4h3.5l1.5 4-2 1.5a11 11 0 006.5 6.5L16 14l4 1.5V19a1.5 1.5 0 01-1.6 1.5A16 16 0 013.5 5.6 1.5 1.5 0 015 4z"/>'),

const view = { tab:'home', homeDay: today(), calMonth: ym(today()), calDay: today(), calMode:'month', payMonth: ym(today()), q:'' };

/* ---------- Building blocks ---------- */
function statusPills(l){
  const p=[];
  if(l.status==='done'){ const uns=l.studentIds.filter(id=>!(l.sent||{})[id] && (l.attendance||{})[id]!=='absent').length; p.push(uns?`<span class="pill brand">${I.send} Update to send</span>`:`<span class="pill mint">${I.check} Done</span>`); }
  else if(l.status==='cancelled') p.push('<span class="pill coral">Cancelled</span>');
  else if(isPast(l)) p.push('<span class="pill amber">Add notes</span>');
  if(l.origDate && l.status!=='cancelled') p.push(`<span class="pill brand">Moved from ${fmtDate(l.origDate)}</span>`);
  return p;
}
function lessonCard(l, opts={}){
  const m = subj(l.subject); const [hm,ap] = fmtTime(l.start).split(' ');
  const pills = statusPills(l);
  return `<button class="lcard ${l.status}" style="--c:${m.c}" data-act="openLesson" data-id="${l.id}">
    <div class="lt">${opts.showDate?`<span class="ld">${esc(fmtDate(l.date))}</span>`:''}<b>${hm}</b><span>${ap}</span><small>${durLabel(l.dur)}</small></div>
    <div class="lb"><div class="nm"><span>${esc(lessonTitle(l))}</span></div>
      <div class="meta"><span><i class="sdot" style="--c:${m.c}"></i>${esc([l.level,l.subject].filter(Boolean).join(' ')||'Lesson')}</span>${l.location?`<span>${I.pin}${esc(l.location)}</span>`:''}</div>
      ${pills.length?`<div class="pills">${pills.join('')}</div>`:''}</div></button>`;
}
const until = l => { const now=new Date(); const s=pd(l.date); const [h,m]=l.start.split(':').map(Number); s.setHours(h,m); const diff=Math.round((s-now)/60000);
  if(diff<=0) return 'Happening now'; if(diff<60) return `In ${diff} min`; if(diff<24*60) return `In ${Math.floor(diff/60)}h ${diff%60?diff%60+'m':''}`.trim(); return fmtDate(l.date); };
const greeting = () => { const h=new Date().getHours(); return h<12?'Good morning':h<18?'Good afternoon':'Good evening'; };
const weekStart = d => { const x=pd(d); return addDays(d, -((x.getDay()+6)%7)); };

function feesDueOn(d){ const out=[]; S.students.filter(s=>s.active!==false && s.rate).forEach(s=>[ym(d), addMonths(ym(d),-1)].forEach(m=>{ const f=feeStatus(s,m); if(f.dueDate===d && f.key!=='none') out.push({s,m,f}); })); return out; }
/* ---------- Screens ---------- */
const SCREENS = {};

      : todays.length?`<div class="next"><span class="glyph" style="--c:#5FCFA6">${I.check}</span><div><div class="t">All done for today</div><div class="m">Remember to send your parent updates.</div></div></div>`:''}
  </section>`;

  const ws = weekStart(view.homeDay);
  h += `<div class="sec"><h2>${ws===weekStart(t)?'This week':`Week of ${pd(ws).getDate()} ${MON[pd(ws).getMonth()]}`}</h2><div class="arrows"><button class="mini-btn" data-act="homeWeek" data-id="-7" aria-label="Previous week">${I.left}</button><button class="mini-btn" data-act="homeWeek" data-id="7" aria-label="Next week">${I.right}</button></div></div>
    <div class="week">${[0,1,2,3,4,5,6].map(i=>{ const day=addDays(ws,i); const ls=lessonsOn(day).filter(l=>l.status!=='cancelled');
      return `<button class="wd ${day===t?'today':''} ${day===view.homeDay?'sel':''}" data-act="homeDay" data-id="${day}" aria-label="${fmtDate(day,true)}, ${ls.length} lessons"><span class="d">${DOW[pd(day).getDay()]}</span><span class="n">${pd(day).getDate()}</span><span class="dots">${ls.slice(0,3).map(l=>`<i style="--c:${subjectColor(l.subject)}"></i>`).join('')}</span></button>`; }).join('')}</div>`;
  const dayL = lessonsOn(view.homeDay);
  h += `<div class="sec"><h2>${view.homeDay===t?'Today’s lessons':esc(fmtDate(view.homeDay,true))}</h2><button class="link" data-act="newLesson" data-date="${view.homeDay}">${I.plus} Add</button></div>`;

  const todo = [];
  S.students.filter(s=>s.active!==false).forEach(s=>[addMonths(ym(t),-1), ym(t)].forEach(m=>{ const f=feeStatus(s,m); if(!owing(f) || f.days===null || f.days>3) return;

  S.lessons.filter(l=>l.status==='scheduled' && isPast(l) && daysBetween(l.date,t)<=21).sort(sortL).reverse().slice(0,5).forEach(l=>
    todo.push(`<button class="row" data-act="openLesson" data-id="${l.id}"><span class="ic amber">${I.note}</span><div class="grow"><div class="t">${esc(lessonTitle(l))}</div><div class="d">${esc(fmtDate(l.date))}, ${fmtTime(l.start)}: attendance and notes missing</div></div><span class="cta">Add notes</span></button>`));
  S.lessons.filter(l=>l.status==='done' && daysBetween(l.date,t)<=10).sort(sortL).reverse().forEach(l=>l.studentIds.forEach(id=>{ const s=stu(id); if(!s || (l.sent||{})[id] || (l.attendance||{})[id]==='absent' || todo.length>=8) return;

SCREENS.calendar = () => {
  let h = `<div class="topbar"><h1>Calendar</h1><button class="round-btn" data-act="newLesson" data-date="${view.calDay}" aria-label="Add lesson">${I.plus}</button></div>
    <div class="seg" style="margin-bottom:14px"><button class="${view.calMode==='month'?'on':''}" data-act="calMode" data-id="month">Month</button><button class="${view.calMode==='list'?'on':''}" data-act="calMode" data-id="list">Agenda</button></div>`;
  const t = today();
  if(view.calMode==='list'){
    let any=false;
    for(let i=0;i<28;i++){ const d=addDays(t,i); const ls=lessonsOn(d); if(!ls.length) continue; any=true;
      h += `<div class="sec"><h2>${i===0?'Today':i===1?'Tomorrow':esc(fmtDate(d,true))}</h2></div>${ls.map(l=>lessonCard(l)).join('')}`; }

SCREENS.payments = () => {

  const due = fs.reduce((a,x)=>a+x.f.due,0), got = fs.reduce((a,x)=>a+x.f.paid,0), od = fs.filter(x=>x.f.key==='overdue').length;

    <div class="bar" style="margin-top:16px"><i class="on" style="flex:${Math.max(0.001,Math.min(got,due))}"></i><i style="flex:${Math.max(0.001,due-got)}"></i></div></section>`;

/* ---------- Sheets ---------- */
const stack = [];
function openSheet(fn, title, isStatic){
  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="scrim"></div><section class="sheet" role="dialog" aria-modal="true"><div class="sh-head"><h3></h3><button class="x" data-act="closeSheet" aria-label="Close">${I.x}</button></div><div class="sh-body"></div><div class="sh-foot" hidden></div></section>`;
  $('#sheets').appendChild(wrap);
  const entry = {wrap, fn, title, isStatic}; stack.push(entry); paintSheet(entry);
  wrap.querySelector('.scrim').addEventListener('click', closeSheet);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ wrap.querySelector('.scrim').classList.add('show'); wrap.querySelector('.sheet').classList.add('show'); }));
  document.body.style.overflow='hidden';
  return entry;
}
function paintSheet(e){
  let r = e.fn(); if(r===null){ closeSheet(); return; }
  if(typeof r==='string') r = {html:r};
  const sh = e.wrap.querySelector('.sheet'), body = sh.querySelector('.sh-body'), foot = sh.querySelector('.sh-foot'), sc = body.scrollTop;
  sh.classList.toggle('has-hero', !!r.hero);
  sh.querySelector('h3').textContent = typeof e.title==='function'? e.title() : (e.title||'');
  body.innerHTML = r.html; body.scrollTop = sc;
  foot.hidden = !r.foot; foot.innerHTML = r.foot||'';
}
function closeSheet(){
  const e = stack.pop(); if(!e) return;
  e.wrap.querySelector('.scrim').classList.remove('show'); e.wrap.querySelector('.sheet').classList.remove('show');
  setTimeout(()=>e.wrap.remove(), 320);
  if(!stack.length) document.body.style.overflow='';
}
function refresh(){ render(); stack.forEach(e=>{ if(!e.isStatic) paintSheet(e); }); }
const topWrap = () => stack[stack.length-1].wrap;

      for(let i=0;i<=(n?n-1:0);i++) S.lessons.push({ id:uid(), seriesId:sid, ...data, date:addDays(data.date,7*i), status:'scheduled', attendance:{}, covered:'', homework:'', next:'', remarks:'', sent:{} });

  });
}

/* ---------- Parent update writer (offline) ---------- */
function rng(seed){ let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function items(text, keep){
  const parts = String(text||'').split(/\n|;|•/).map(x=>x.replace(/^\s*(?:[-–*•]|\d+[.)])\s+/,'').trim().replace(/[.。]+$/,'')).filter(Boolean);
  return keep ? parts : parts.map(p=> /^[A-Z][a-z]/.test(p) && !/^(I|PSLE|SA|WA|CA|O|A|N)\b/.test(p) ? p[0].toLowerCase()+p.slice(1) : p);
}
const listify = a => a.length<=1 ? (a[0]||'') : a.slice(0,-1).join(', ')+' and '+a[a.length-1];
function partOfDay(){ const h=new Date().getHours(); return h<12?'morning':h<18?'afternoon':'evening'; }
const lines = t => String(t||'').split(/\n/).map(x=>x.replace(/^\s*(?:[-–*•]|\d+[.)])\s+/,'').trim()).filter(Boolean);
const sentence = x => { x=String(x).trim(); if(!x) return ''; x=x[0].toUpperCase()+x.slice(1); return /[.!?)]$/.test(x)?x:x+'.'; };
const dayMonth = d => { const x=pd(d); return `${x.getDate()} ${MONL[x.getMonth()]}`; };
/* ---------- Note polisher (offline) ---------- */
const ABBR = [
  [/\bhw\b/gi,'homework'],[/\bqns?\b/gi,m=>/s$/i.test(m)?'questions':'question'],[/\bques\b/gi,'questions'],[/\bqs\b/gi,'questions'],
  [/\bans\b/gi,'answers'],[/\bcorr\b/gi,'corrections'],[/\bw\/o\b/gi,'without'],[/\bw\/\s*/gi,'with '],[/\bw\b(?=\s+(?:some|a|the|little|help|guidance|no)\b)/gi,'with'],
  [/\bb4\b/gi,'before'],[/\btmr\b/gi,'tomorrow'],[/\bnxt\b/gi,'next'],[/\bwk\b/gi,'week'],[/\bwks\b/gi,'weeks'],[/\bsch\b/gi,'school'],
  [/\babt\b/gi,'about'],[/\bthru\b/gi,'through'],[/\b(?:bcos|bcoz|cos|coz|bc)\b/gi,'because'],[/\s&\s/g,' and '],[/\s\+\s(?=[a-z])/gi,' and '],[/\sn\s/g,' and '],
  [/\bintro\b/gi,'introduce'],[/\bprac\b/gi,'practice'],[/\brev\b/gi,'revision'],[/\b(?:wksht|ws)\b/gi,'worksheet'],[/\bass(?:essment)?\.?\s*bk\b/gi,'assessment book'],[/\bbk\b/gi,'book'],[/\btb\b/gi,'textbook'],[/\bwb\b/gi,'workbook'],
  [/\bppr\b/gi,'paper'],[/\bexam ppr\b/gi,'exam paper'],[/\beg\b/gi,'e.g.'],[/\bmaybe\b/gi,'possibly'],[/\babit\b/gi,'a little'],[/\ba bit\b/gi,'a little'],[/\balot\b/gi,'a lot'],[/\bgd\b/gi,'good'],
  [/\bdont\b/gi,'do not'],[/\bdon't\b/gi,'do not'],[/\bdidnt\b/gi,"did not"],[/\bdidn't\b/gi,'did not'],[/\bcant\b/gi,'cannot'],[/\bcan't\b/gi,'cannot'],[/\bwasnt\b/gi,'was not'],[/\bwasn't\b/gi,'was not'],[/\bisnt\b/gi,'is not'],[/\bisn't\b/gi,'is not'],[/\bwont\b/gi,'will not'],[/\bwon't\b/gi,'will not'],
  [/\b(psle|mcq|mcqs|sa1|sa2|wa1|wa2|wa3|ca1|ca2|eoy|ib|ip|jc|olevel)\b/gi,m=>m.toUpperCase()],[/\bi\b/g,'I'],
];
function tidy(t){
  let x=String(t||'').replace(/\s+/g,' ').trim();
  x=x.replace(/\bpg?s?\.?\s*(\d+)\s*[-–to]+\s*(\d+)/gi,'pages $1–$2').replace(/\bpg?\.?\s*(\d+)\b/gi,'page $1').replace(/\bpp\.?\s*(\d+)\s*[-–]\s*(\d+)/gi,'pages $1–$2');
  x=x.replace(/\bq\s*(\d+)\s*[-–]\s*q?\s*(\d+)/gi,'questions $1–$2').replace(/\bq(\d+)\b/gi,'question $1');
  ABBR.forEach(([re,rp])=>{ x=x.replace(re,rp); });
  x=x.replace(/\b\d+x(?:(?:\s*,\s*|\s+and\s+|\s+)\d+x)+\b/gi, g=>listify(g.split(/\s*,\s*|\s+and\s+|\s+/).filter(Boolean).map(z=>z.toLowerCase())));
  x=x.replace(/\b((?:the\s+)?[a-z0-9 ]{0,20}?(?:assessment book|workbook|textbook|worksheet|paper))\s+(pages? \d+(?:–\d+)?)/i,(m0,bk,pg)=>`${pg} of the ${bk.replace(/^the\s+/i,'')}`);
  x=x.replace(/\b(in|from|on|of)\s+(?!the\b|her\b|his\b|my\b|a\b|an\b|their\b|our\b|class\b)((?:[A-Z]{2}\d\s+)?(?:assessment book|workbook|textbook|worksheet|paper|exam paper)\b)/gi,'$1 the $2');
  const me = /\bwith (her|him|them)\b/i.test(x) ? 'I' : 'we';
  x=x.replace(/,?\s+so\s+(?!we\b|she\b|he\b|I\b|that\b|they\b)(went|gave|had|did|showed|taught|re-?assigned|assigned|\w+ed)\b/gi,(m0,v)=>`, so ${me} ${v}`);
  x=x.replace(/\b(complete|finish|do|attempt)\s+(remaining|rest of)\b/gi,'$1 the $2').replace(/^(remaining|rest of)\b/i,'the $1');
  x=x.replace(/\s+([,.;:!?])/g,'$1').replace(/([,;])(?=\S)/g,'$1 ').replace(/:(?=[A-Za-z])/g,': ').replace(/\.{2,}/g,'.').replace(/[.]+$/,'');
  return x.trim();
}
const lowerFirst = x => /^[A-Z][a-z]/.test(x) && !/^(I|PSLE|MCQ|SA\d|WA\d)\b/.test(x) ? x[0].toLowerCase()+x.slice(1) : x;
const capFirst = x => x ? x[0].toUpperCase()+x.slice(1) : x;
const TUTOR_PAST = /^(went through|covered|reviewed|revised|discussed|introduced|taught|explained|worked on|looked at|recapped|marked|checked|started|began|continued|moved on|focused|focussed|touched on|went over|gave)\b/i;
const KID_PAST = /^(completed|scored|got|attempted|managed|answered|solved|understood|struggled|made|showed|was|were|learnt|learned|mastered|forgot|needed|could|can|did|had|is|seems|seemed|tried|remembered|improved|grasped|drew|wrote|read|memorised|memorized|practised|practiced|finished|knows|knew|enjoyed|found|took|needs|has|kept|missed)\b/i;
const BASE_VERB = /^(continue|test|introduce|start|begin|revise|go|do|work|practise|practice|review|cover|move|teach|recap|finish|complete|attempt|try|focus|draw|check|show|read|write|memorise|memorize|use|avoid|remember|slow|be|learn|correct|redo|prepare|study|look|explain|keep|spend|bring|label|underline|highlight|plan|build|strengthen|improve|consolidate|reinforce|recite|time|submit)\b/i;
const HAS_SUBJECT = /^(we|i|she|he|they|our|my|her|his|the student|student)\b/i;
function polishLine(raw, section, kid){
  let x = tidy(raw); if(!x) return '';
  let label = '';
  const m = x.match(/^([^:]{2,40}):\s*(.+)$/) || x.match(/^([^–\-]{2,30}?)\s+[-–]\s+(.+)$/); if(m && section==='summary'){ label = capFirst(m[1].trim()); x = m[2].trim(); }
  const startsKid = new RegExp('^'+kid.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i').test(x);
  const body = lowerFirst(x);
  let out;
  const first = x.split(/,?\s+(?:so|but|and then|then)\s+/i)[0];
  const tutorSide = /\bwith (her|him|them)\b/i.test(first) || /^(did not|didn't|no) (have )?time\b/i.test(x) || /^(was|were) not able to\b.*\bwith (her|him)/i.test(x);
  if(tutorSide && !startsKid && !HAS_SUBJECT.test(x) && section==='summary') out = `I ${body}`;
  else if(startsKid || HAS_SUBJECT.test(x) || /^(once|after|when|before|by|in|next|from|if|as|since|this|these|there|it)\b/i.test(x)) out = x;
  else if(section==='summary'){
    if(TUTOR_PAST.test(x)) out = `We ${body}`;
    else if(KID_PAST.test(x) || /\bfull marks|\bscored|\b\d+\s*\/\s*\d+/i.test(x) && /^\w+ed\b/.test(x)) out = `${kid} ${body}`;
    else if(/^\w+ed\b/i.test(x)) out = `${kid} ${body}`;
    else if(/\bfull marks\b/i.test(x)) out = `${kid} scored ${body.replace(/^(scored|got)\s+/i,'')}`;
    else out = `We covered ${body}`;
  } else if(section==='improve'){
    if(/^(needs? to|should|must|has to|have to)\b/i.test(x)) out = `${kid} ${body.replace(/^need to/i,'needs to').replace(/^have to/i,'has to')}`;
    else if(BASE_VERB.test(x)) out = `I will encourage ${kid} to ${body}`;
    else out = `${kid} would benefit from more attention to ${body}`;
  } else if(section==='homework'){
    if(BASE_VERB.test(x)) out = `${kid} is to ${body}`;
    else out = `${kid} is to complete ${body}`;
  } else if(section==='next'){
    if(/^continu(e|ing)\b/i.test(x) || BASE_VERB.test(x)) out = `We will ${body.replace(/^continuing/,'continue')}`;
    else if(/^\w+ing\b/i.test(x)) out = `We will be ${body}`;
    else out = `We will work on ${body}`;
  } else if(section==='ahead'){
    if(BASE_VERB.test(x)) out = `We will ${body}`;
    else out = `We will move on to ${body}`;
  } else out = x;
  out = out.replace(/\b(we will|we) (we will|we)\b/gi,'$1').replace(/\s+/g,' ').trim();
  return label ? `${label}: ${capFirst(out)}` : capFirst(out);
}
const polishBlock = (text, section, kid) => lines(text).map(x=>polishLine(x, section, kid)).filter(Boolean).join('\n');

function composeReport(l0, sid, o){
  const s=stu(sid), kid=firstName(s.name), subj=l0.subject||s.subject||'';
  const l = o.texts ? {...l0, ...o.texts} : o.polish ? {...l0, covered:polishBlock(l0.covered,'summary',kid), improve:polishBlock(l0.improve,'improve',kid), homework:polishBlock(l0.homework,'homework',kid), next:polishBlock(l0.next,'next',kid), ahead:polishBlock(l0.ahead,'ahead',kid)} : l0;
  const a=(l.attendance||{})[sid]||'present', absent=a==='absent';
  const H = t => `*${t}*`; const bl = arr => arr.map(x=>'• '+sentence(x)).join('\n');
  const out=[];
  if(s.parentName) out.push(`Hi ${s.parentName},`);
  out.push(absent ? `I would like to let you know that ${kid} was absent from our ${subj?subj+' ':''}lesson on ${dayMonth(l.date)}. Please let me know if you would like to arrange a make-up lesson.`
                  : `I would like to share an update on ${kid}'s progress from our ${subj?subj+' ':''}lesson on ${dayMonth(l.date)}.`);
  if(!absent){
    const sum=[]; if(a==='late') sum.push(`${kid} arrived late, so we focused on the most important points`);
    if(o.covered) sum.push(...lines(l.covered));
    if(sum.length) out.push(H('Lesson Summary')+'\n'+bl(sum));
    if(o.homework && lines(l.homework).length) out.push(H('Homework')+'\n'+bl(lines(l.homework)));
    if(o.improve && lines(l.improve).length){ const im=lines(l.improve); out.push(H('Areas for Improvement')+'\n'+(im.length>1?bl(im):sentence(im[0]))); }
  }
  const plan=[];
  if(o.nextDate && !/\bnext lesson (is|will be)\b/i.test((l0.next||'')+' '+(l0.ahead||''))){ const nl=nextLessonFor(sid,l); if(nl) plan.push(`Our next lesson is on ${fmtDate(nl.date,true)} at ${fmtTime(nl.start)}${nl.location&&nl.location!==l.location?` (${nl.location})`:''}${nl.origDate?`, rescheduled from ${fmtDate(nl.origDate,true)} at ${fmtTime(nl.origStart)}`:''}`); }
  if(o.next) plan.push(...lines(l.next));
  if(plan.length) out.push(H('Plan for the Next Lesson')+'\n'+bl(plan));
  const ahead=[];
  if(o.ahead) ahead.push(...lines(l.ahead));
  if(o.exam){ const ex=upcomingExams(sid,l.date>today()?l.date:today(),60)[0]; if(ex) ahead.push(`${ex.title} is on ${fmtDate(ex.date,true)} (${ex.days===0?'today':ex.days===1?'tomorrow':ex.days+' days away'}), and we will keep revising in preparation for it`); }
  if(ahead.length) out.push(H('Looking Ahead')+'\n'+bl(ahead));
  if(o.remarks && lines(l.remarks).length) out.push(H('Additional Notes')+'\n'+lines(l.remarks).map(sentence).join(' '));
  if(o.payment){ const m=ym(l.date), f=feeStatus(s,m), owe=f.due-f.paid; if(owe>0) out.push(H('Fees')+'\n'+`A gentle reminder that the fees for ${MONL[+m.slice(5)-1]} (${money(owe)}) ${dueWords(f)}. Thank you!`); }
  out.push('Please do not hesitate to contact me should you have any questions or concerns.');
  const sign = S.settings.signOff || S.settings.tutorName; if(sign) out.push(sign);
  return out.join('\n\n');
}
function compose(lesson, sid, o){
  if(o.tone==='report') return composeReport(lesson, sid, o);
  const s = stu(sid); const R = rng(o.seed||1); const P = a => a[Math.floor(R()*a.length)];
  const kid = firstName(s.name); const subj = lesson.subject || s.subject || 'tuition';
  const tone = o.tone; const parent = s.parentName || '';
  const isToday = lesson.date===today(); const when = isToday ? 'today' : `on ${fmtDate(lesson.date,true)}`;
  const a = (lesson.attendance||{})[sid] || 'present';
  const out = [];
  const greet = tone==='pro' ? `Dear ${parent||'Parent'},` : tone==='brief' ? `Hi ${parent||'there'},` : P([`Hi ${parent||'there'}! 😊`,`Hello ${parent||'there'}!`,`Hi ${parent||'there'},`]);
  out.push(greet);
  const body = [];
  const sec = (k, kind) => (o.polish!==false ? lines(polishBlock(lesson[k], kind, kid)) : lines(lesson[k]).map(tidy)).map(sentence);
  const para = arr => { const pre=`${kid} is to `; if(arr.length>1 && arr.every(x=>x.startsWith(pre))){ const rest=arr.map(x=>x.slice(pre.length).replace(/[.]+$/,'')); const verb=rest.every(x=>x.startsWith('complete '))?'complete ':''; return `${pre}${verb}${listify(rest.map(x=>verb?x.slice(verb.length):x))}.`; } return arr.join(' '); };
  const bullets = arr => arr.map(x=>'• '+x).join('\n');
  const dateInNotes = /\bnext lesson (is|will be)\b/i.test((lesson.next||'')+' '+(lesson.ahead||''));
  if(a==='absent'){
    body.push(tone==='pro' ? `I would like to inform you that ${kid} was absent from the ${subj} lesson ${when}.` : P([`${kid} missed ${isToday?"today's":'the'} ${subj} lesson${isToday?'':' '+when}.`, `Just letting you know ${kid} wasn't at ${isToday?"today's":'the'} ${subj} lesson${isToday?'':' '+when}.`]));
    body.push(tone==='pro' ? `Please let me know if a make-up lesson is required, and I will arrange a suitable time.` : P([`Let me know if you'd like to arrange a make-up lesson.`, `Happy to arrange a make-up lesson if needed, just let me know a time that works.`]));
  } else {
    const cov=sec('covered','summary'), imp=sec('improve','improve'), hw=sec('homework','homework'), nx=sec('next','next');
    if(tone==='brief'){
      body.push(`Update on ${kid}'s ${subj} lesson (${fmtDate(lesson.date)}):`);
      if(a==='late') body.push(`• ${kid} arrived late`);
      [[o.covered,cov],[o.homework,hw],[o.improve,imp],[o.next,nx]].forEach(([on,arr])=>{ if(on && arr.length) body.push(bullets(arr)); });
    } else {
      let open = tone==='pro' ? `Here is an update on ${kid}'s ${subj} lesson ${when}.` : P([`Here's a quick update on ${kid}'s ${subj} lesson ${when}.`, `Sharing a short update on ${kid}'s ${subj} lesson ${when}.`, `Just a quick update on how ${kid}'s ${subj} lesson went ${when}.`]);
      if(a==='late') open += tone==='pro' ? ` ${kid} arrived slightly late, so we prioritised the key concepts.` : ` ${kid} came in a little late, so we focused on the most important parts.`;
      body.push(open);
      if(o.covered && cov.length) body.push((tone==='pro' ? 'Here is a summary of the lesson:' : P(["Here's what we did:","Here's what we worked on:"])) + '\n' + bullets(cov));
      if(o.focus && s.learning) body.push(tone==='pro' ? `Current focus: ${s.learning.replace(/[.]+$/,'')}.` : `Our current focus is ${items(s.learning).join('; ')}.`);
      if(o.improve && imp.length) body.push(para(imp));
      if(o.homework && hw.length) body.push(para(hw) + (tone==='pro' ? ` Kindly remind ${kid} to complete ${hw.length>1?'them':'it'} before the next lesson.` : ` Please help remind ${kid} to finish ${hw.length>1?'them':'it'} before our next lesson 🙏`));
      if(o.next && nx.length) body.push(para(nx));
    }
  }
  if(o.nextDate && !dateInNotes){ const nl = nextLessonFor(sid, lesson); if(nl){
    let t = `${tone==='pro'?'The next lesson is scheduled for':'Our next lesson is on'} ${fmtDate(nl.date,true)} at ${fmtTime(nl.start)}${nl.location&&nl.location!==lesson.location?` (${nl.location})`:''}`;
    if(tone==='brief') t = `• Next lesson: ${fmtDate(nl.date)}, ${fmtTime(nl.start)}${nl.origDate?` (moved from ${fmtDate(nl.origDate)} ${fmtTime(nl.origStart)})`:''}`;
    else if(nl.origDate) t += tone==='pro' ? `, rescheduled from ${fmtDate(nl.origDate)} ${fmtTime(nl.origStart)}. Please take note.` : `. Please note it's been moved from ${fmtDate(nl.origDate)} ${fmtTime(nl.origStart)}.`;
    else if(tone!=='brief') t += '.';
    body.push(t); } }
  if(o.exam){ const ex = upcomingExams(sid, lesson.date>today()?lesson.date:today(), 60)[0]; if(ex){
    const d = ex.days; const dl = d===0?'today':d===1?'tomorrow':`in ${d} days`;
    body.push(tone==='brief' ? `• ${ex.title}: ${fmtDate(ex.date)} (${dl})` : tone==='pro' ? `As ${ex.title} is ${dl} (${fmtDate(ex.date,true)}), we will continue to prioritise revision in the coming lessons.` : P([`With ${ex.title} coming up ${dl} (${fmtDate(ex.date)}), we'll keep up the revision. ${kid} can do it! 💪`, `${ex.title} is ${dl}, on ${fmtDate(ex.date)}, so we'll keep revising steadily till then.`])); } }
  if(o.ahead && lesson.ahead && a!=='absent'){ const ah=sec('ahead','ahead'); if(ah.length) body.push(tone==='brief' ? bullets(ah) : para(ah)); }
  if(o.remarks && lesson.remarks) body.push((tone==='brief'?'• ':'') + lesson.remarks.trim());
  if(o.payment){ const m=ym(lesson.date); const f=feeStatus(s,m); const owe=f.due-f.paid; if(owe>0)
    body.push(tone==='pro' ? `Kindly note that the fees for ${MONL[+m.slice(5)-1]} (${money(owe)}) ${dueWords(f)}. Thank you.` : tone==='brief' ? `• ${MONL[+m.slice(5)-1]} fees: ${money(owe)}${f.dueDate?`, due ${fmtDate(f.dueDate)}`:''}` : `A gentle reminder that ${MONL[+m.slice(5)-1]}'s fees of ${money(owe)} ${dueWords(f)}. Thank you!`); }
  out.push(...(tone==='brief' ? [body.join('\n')] : body));
  if(tone!=='brief') out.push(tone==='pro' ? 'Please feel free to contact me if you have any questions.' : P([`Let me know if you have any questions!`, `Feel free to reach out if you have any questions 😊`, `Thank you, and have a lovely ${partOfDay()}!`]));
  const sign = S.settings.signOff || (S.settings.tutorName ? (tone==='pro'?`Best regards,\n${S.settings.tutorName}`:`${S.settings.tutorName}`) : '');
  if(sign) out.push(sign);
  return out.filter(Boolean).join(tone==='brief' ? '\n\n' : '\n\n');
}

/* On-device LLM (WebLLM, optional) */
const llm = { engine:null, loading:false, status:'', progress:0 };
async function loadLLM(){
  if(llm.engine || llm.loading) return llm.engine;
  if(!navigator.gpu) throw new Error('WebGPU is not available on this browser.');
  llm.loading = true; llm.status='Loading AI runtime…'; updLLMUi();
  try{
    const webllm = await import('https://esm.run/@mlc-ai/web-llm');
    llm.engine = await webllm.CreateMLCEngine(S.settings.llmModel, { initProgressCallback: r => { llm.status = r.text; llm.progress = r.progress||0; updLLMUi(); } });
    llm.status = 'Model ready. It now works offline.'; llm.progress = 1;
  } catch(e){ llm.status = 'Could not load the model: '+(e.message||e)+'. The built-in writer will be used instead.'; throw e; }
  finally{ llm.loading=false; updLLMUi(); }
  return llm.engine;
}
function updLLMUi(){ const st=$('#llmStatus'), b=$('#llmBar'), c=$('#composeStatus'); if(st) st.textContent=llm.status; if(b) b.style.width=(llm.progress*100)+'%'; if(c) c.textContent=llm.status; }
/* ---------- AI writing: Claude, Gemini or on-device ---------- */
const AI_DEFAULT_MODEL = { claude:'claude-haiku-5-5', gemini:'gemini-flash-latest' };
const aiProvider = () => S.settings.aiProvider || 'none';
const aiReady = () => { const p=aiProvider(); return p==='webllm' ? !!navigator.gpu : (p==='claude'||p==='gemini') && !!String(S.settings['aiKey_'+p]||'').trim(); };
const aiName = () => ({claude:'Claude', gemini:'Gemini', webllm:'the on-device model'})[aiProvider()] || 'AI';
async function aiComplete(system, user, opts={}){
  const p = aiProvider(); const key = String(S.settings['aiKey_'+p]||'').trim(); const model = String(S.settings['aiModel_'+p]||'').trim() || AI_DEFAULT_MODEL[p];
  if((p==='claude'||p==='gemini') && !key) throw new Error('Add your API key in Settings first.');
  if(!navigator.onLine && p!=='webllm') throw new Error('You’re offline. The built-in wording is used instead.');
  if(p==='claude'){
    const r = await fetch('https://api.anthropic.com/v1/messages', { method:'POST', headers:{ 'content-type':'application/json', 'x-api-key':key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
      body: JSON.stringify({ model, max_tokens: opts.max||1500, temperature: 0.4, system, messages:[{role:'user', content:user}] }) });
    const j = await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error?.message || `Claude returned error ${r.status}`);
    return (j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('').trim();
  }
  if(p==='gemini'){
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, { method:'POST', headers:{ 'content-type':'application/json', 'x-goog-api-key':key },
      body: JSON.stringify({ systemInstruction:{parts:[{text:system}]}, contents:[{role:'user', parts:[{text:user}]}], generationConfig:{ temperature:0.4, maxOutputTokens: opts.max||4096, ...(opts.json?{responseMimeType:'application/json'}:{}) } }) });
    const j = await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error?.message || `Gemini returned error ${r.status}`);
    return (j.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('').trim();
  }
  if(p==='webllm'){
    const eng = await loadLLM();
    const r = await eng.chat.completions.create({ messages:[{role:'system',content:system},{role:'user',content:user}], temperature:0.3, max_tokens: opts.max||900 });
    return (r.choices?.[0]?.message?.content||'').trim();
  }
  throw new Error('AI writing is off. Choose a provider in Settings.');
}
/* Names never leave the phone */
const reEsc = x => x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function maskNames(text, s){
  const pairs = [];
  if(s.parentName) pairs.push([s.parentName,'PARENT']);
  [s.name, ...String(s.name||'').split(/\s+/)].filter(n=>n && n.length>1).forEach(n=>pairs.push([n,'STUDENT']));
  pairs.sort((a,b)=>b[0].length-a[0].length);
  let t = String(text||''); pairs.forEach(([n,tag])=>{ t = t.replace(new RegExp('\\b'+reEsc(n)+'\\b','gi'), tag); });
  return t.replace(/\bSTUDENT(\s+STUDENT)+\b/g,'STUDENT');
}
const unmask = (t, s) => String(t).replace(/\bSTUDENT\b/g, firstName(s.name)).replace(/\bPARENT\b/g, s.parentName||'Parent');
const SEC = [['covered','summary','summary'],['improve','improvement','improve'],['homework','homework','homework'],['next','next_lesson','next'],['ahead','looking_ahead','ahead']];
const notesHash = l => SEC.map(([k])=>l[k]||'').join('\u0001') + '|' + aiProvider() + '|' + (S.settings['aiModel_'+aiProvider()]||'');
async function aiPolishSections(l, sid){
  const s = stu(sid); const src = {}; SEC.forEach(([k,jk])=>src[jk] = lines(l[k]).map(x=>maskNames(x,s)));
  const sys = `You help a private tutor in Singapore write a lesson progress report that will be sent to a parent on WhatsApp. You receive the tutor's rough notes as JSON lists. Rewrite every note into smooth, natural, grammatically correct British English, in the polished but warm tone of an experienced tutor writing to a parent.
Rules:
- Reply with JSON only, with exactly the same keys and exactly the same number of items in each list, in the same order.
- Each item becomes one or two complete, well-joined sentences. No bullet symbols, markdown or emojis.
- Keep every fact: topics, numbers, fractions, page and question numbers, scores and dates. Do not add facts, praise or advice that are not in the notes.
- Refer to the student as STUDENT and to the parent as PARENT; these are replaced with real names later. Use she/her or he/him only if the notes do.
- Use "I" for what the tutor did or will do, and "we" for work done together in class.
- If a note starts with a short label and a colon (for example "Exam paper:"), keep that label and the colon at the start.
- summary: what happened in the lesson, past tense. improvement: areas to work on, phrased constructively. homework: what the student must do before the next lesson. next_lesson and looking_ahead: plans, future tense.`;
  const raw = await aiComplete(sys, JSON.stringify(src, null, 1), {json:true});
  let out; try{ out = JSON.parse(raw.slice(raw.indexOf('{'), raw.lastIndexOf('}')+1)); }catch(e){ throw new Error('the AI reply could not be read. Try again.'); }
  const kid = firstName(s.name); const res = {};
  SEC.forEach(([k,jk,sec])=>{ const a = Array.isArray(out[jk]) ? out[jk].map(x=>unmask(String(x).replace(/\s*\n+\s*/g,' ').replace(/^[•\-*]\s*/,'').trim(), s)).filter(Boolean) : [];
    res[k] = (a.length===src[jk].length ? a : lines(l[k]).map(x=>polishLine(x, sec, kid))).join('\n'); });
  return res;
}
async function aiRewriteMessage(draft, sid, tone){
  const s = stu(sid);
  const sys = `You rewrite a message that a private tutor in Singapore sends to a parent on WhatsApp. Make it read smoothly, with natural grammar and sentence flow. Keep every fact exactly (dates, times, topics, homework, amounts) and do not invent anything. Keep words wrapped in *stars* and any • bullet points. Tone: ${tone==='pro'?'polite, formal and professional':tone==='brief'?'very short and clear':'warm, friendly and encouraging, with at most two emojis'}. Refer to the student as STUDENT and the parent as PARENT. Reply with the message only.`;
  return unmask(await aiComplete(sys, maskNames(draft, s)), s) || draft;
}

function waNumber(raw){
  let d = String(raw||'').replace(/[^\d+]/g,''); if(!d) return '';
  if(d.startsWith('+')) return d.slice(1);
  if(d.startsWith('00')) return d.slice(2);
  if(d.length<=8) return (S.settings.country||'')+d;
  return d;
}
function openWA(phone, text){

  const url = n ? `https://wa.me/${n}?text=${encodeURIComponent(text)}` : `https://wa.me/?text=${encodeURIComponent(text)}`;
  const a = document.createElement('a'); a.href=url; a.target='_blank'; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove();
}

      <div class="wa-body"><div class="bubble"><textarea id="msgBox" aria-label="Message">${esc(compose(l,sid,st))}</textarea><span class="tm">${fmtTime(fromMin(now.getHours()*60+now.getMinutes()))} ✓✓</span></div></div></div>
    <div class="tools"><button id="regen">${I.redo} Rewrite</button>${aiProvider()!=='none'?`<button id="aiBtn">${I.spark} Polish with AI</button>`:''}<button id="copyBtn">${I.copy} Copy</button></div>
    <div id="composeStatus" class="hint" style="margin:8px 4px 0;min-height:16px">Tap the message to edit it. *Stars* show as bold on WhatsApp.</div>`,
    foot:`<button class="btn wa block" id="sendWA">${I.wa} Send to ${esc(s.parentName||'parent')} on WhatsApp</button>` }), `Update for ${s.name}`, true);
  const w = topWrap(); const box = $('#msgBox',w);
  const grow = () => { box.style.height='auto'; box.style.height = Math.max(260, box.scrollHeight)+'px'; };
  requestAnimationFrame(grow);
  const regen = async () => { if(edited && !(await ask('Replace your edits with a freshly written message?','Replace'))) return false; box.value=compose(l,sid,st); edited=false; grow(); return true; };
  box.addEventListener('input', ()=>{ edited=true; grow(); });
  $('#toneSeg',w).addEventListener('click', async e=>{ const b=e.target.closest('[data-tone]'); if(!b) return; const prev=st.tone; st.tone=b.dataset.tone; if((await regen())===false){ st.tone=prev; return; } $$('#toneSeg button',w).forEach(x=>x.classList.toggle('on',x===b)); });
  $('#incl',w).addEventListener('click', async e=>{ const b=e.target.closest('[data-k]'); if(!b) return; const k=b.dataset.k; st[k]=!st[k]; if(k==='polish'){ st.texts=null; S.settings.polish=st[k]; save(); } if((await regen())===false){ st[k]=!st[k]; return; } b.classList.toggle('on',st[k]); b.setAttribute('aria-pressed',st[k]); });
  $('#regen',w).addEventListener('click', ()=>{ st.seed++; st.texts=null; edited=false; regen(); });
  $('#copyBtn',w).addEventListener('click', async()=>{ try{ await navigator.clipboard.writeText(box.value); toast('Copied'); }catch(e){ box.select(); document.execCommand('copy'); toast('Copied'); } });
  const status = t => { const el=$('#composeStatus',w); if(el) el.textContent=t; };
  const runAI = async (auto) => { const b=$('#aiBtn',w);
    if(!aiReady()){ if(!auto) status(aiProvider()==='webllm'?'The on-device model isn’t supported in this browser.':'Add your API key in Settings → Parent updates to use AI.'); return; }
    if(b) b.disabled=true; status(`✨ Polishing with ${aiName()}…`);
    try{
      if(st.tone==='report'){ if(!auto && edited && !(await ask('Replace your edits with the AI-polished version?','Replace'))){ if(b) b.disabled=false; status(''); return; }
        const texts = await aiPolishSections(l, sid); if(auto && edited){ status('AI version ready, but you’ve started editing, so your text was kept.'); if(b) b.disabled=false; return; }
        st.texts = texts; st.polish = true; l.ai = l.ai||{}; l.ai[sid] = {h:notesHash(l), texts}; save(); box.value = compose(l,sid,st); edited=false; }
      else { box.value = await aiRewriteMessage(box.value, sid, st.tone); edited=true; }
      grow(); status(`Polished by ${aiName()}. Please read it through before sending.`); }
    catch(err){ status(`AI unavailable: ${String(err.message||err).replace(/[.\s]+$/,'')}. Showing the built-in wording.`); }
    if(b) b.disabled=false; };
  $('#aiBtn',w)?.addEventListener('click', ()=>runAI(false));
  if(st.tone==='report' && st.polish && !st.texts && S.settings.aiAuto!==false && aiReady() && aiProvider()!=='webllm' && SEC.some(([k])=>lines(l[k]).length)) runAI(true);
  else if(st.texts) status(`Polished by ${aiName()} earlier. Tap Rewrite for the built-in wording.`);
  $('#sendWA',w).addEventListener('click', ()=>{ openWA(s.parentPhone, box.value); l.sent=l.sent||{}; l.sent[sid]=true; save(); setTimeout(()=>{ closeSheet(); refresh(); toast('Marked as sent'); },500); });
}

/* ---------- New school year: move students up a level ---------- */
function nextLevel(lv){ const t=String(lv||'').trim(); let m;
  const simple = {N1:'N2', N2:'K1', K1:'K2', K2:'P1'}; if(simple[t.toUpperCase()]) return simple[t.toUpperCase()];
  if((m=t.match(/^(?:p|pri|primary)\s*([1-6])$/i))) return +m[1]<6 ? `P${+m[1]+1}` : 'S1';
  if((m=t.match(/^(?:s|sec|secondary)\s*([1-5])$/i))) return +m[1]<4 ? `S${+m[1]+1}` : null;
  if(/^jc\s*1$/i.test(t)) return 'JC2';
  return null; }
function levelSheet(year){
  const list = S.students.filter(s=>s.active!==false).sort((a,b)=>a.name.localeCompare(b.name));
  if(!list.length){ S.settings.levelYear=year; save(); return; }
  openSheet(()=>({ html:`<div class="card pad" style="margin-bottom:14px;border-color:var(--gold-line)"><div class="fc-title" style="margin-bottom:6px">${I.spark} Welcome to ${year}</div><p class="sub" style="margin:0">It’s a new school year. Check each student’s new level, then tap Update levels. Their lessons from 1 January onwards are updated too.</p></div>
    <form id="lvlForm">${list.map(s=>{ const n=nextLevel(s.level); return `<div class="card" style="margin-bottom:10px"><div class="row" style="align-items:center">${avatar(s)}<div class="grow"><div class="t">${esc(s.name)}</div><div class="d">Now ${esc(s.level||'no level')}${s.subject?', '+esc(s.subject):''}</div></div>
      <label class="chip" style="padding:6px 11px"><input type="checkbox" name="inc" value="${s.id}" ${n?'checked':''}>Update</label></div>
      <div style="padding:0 14px 12px;display:flex;align-items:center;gap:10px"><span class="muted small" style="white-space:nowrap">New level</span><input class="input" name="lv_${s.id}" list="lvlNY" value="${esc(n||s.level||'')}" style="padding:9px 12px">${n?'':'</div><p class="hint" style="margin:-4px 14px 12px">Type their next level (for example JC1, Poly or S5), or leave it unticked.</p><div hidden>'}</div></div>`; }).join('')}
    <datalist id="lvlNY">${['N1','N2','K1','K2','P1','P2','P3','P4','P5','P6','S1','S2','S3','S4','S5','JC1','JC2','Poly','ITE','Adult'].map(x=>`<option value="${x}">`).join('')}</datalist></form>`,
    foot:`<div class="btns"><button class="btn ghost" data-act="skipLevels" data-id="${year}">Skip this year</button><button class="btn" data-act="applyLevels" data-id="${year}">Update levels</button></div>` }), 'New school year', true);
  const f=$('#lvlForm',topWrap()); f.addEventListener('input', e=>{ if(e.target.name?.startsWith('lv_')){ const cb=f.querySelector(`input[name=inc][value="${e.target.name.slice(3)}"]`); if(cb) cb.checked=!!e.target.value.trim(); } });
}
function applyLevels(year){
  const f=$('#lvlForm',topWrap()); const fd=new FormData(f); const ids=fd.getAll('inc'); let n=0;
  ids.forEach(id=>{ const s=stu(id); const lv=(fd.get('lv_'+id)||'').trim(); if(!s||!lv||lv===s.level) return;
    s.level=lv; n++;
    S.lessons.forEach(l=>{ if(l.date>=`${year}-01-01` && l.studentIds.length===1 && l.studentIds[0]===id && l.status!=='done') l.level=lv; }); });
  S.settings.levelYear=year; save(); closeSheet(); refresh(); toast(n?`${n} student${n>1?'s':''} moved up a level`:'Levels unchanged');
}
function checkNewYear(){
  const y=new Date().getFullYear();
  if(!S.settings.levelYear){ S.settings.levelYear=y; save(); return; }
  if(S.settings.autoLevel!==false && y>S.settings.levelYear && !stack.some(e=>e.title==='New school year')) levelSheet(y);
}

/* ---------- Actions ---------- */
const ACT = {
  tab: d => { view.tab=d.id; render(); window.scrollTo(0,0); },
  closeSheet: () => closeSheet(),
  quickAdd: () => quickAdd(),
  pickPay: () => pickPay(),
  hideInstall: () => { S.settings.hideInstall=true; save(); render(); },
  homeDay: d => { view.homeDay=d.id; render(); },
  homeWeek: d => { view.homeDay=addDays(view.homeDay,+d.id); render(); },
  newLesson: d => lessonForm(null, {date:d.date, sid:d.sid}),
  editLesson: d => lessonForm(d.id),
  openLesson: d => lessonSheet(d.id),
  reschedule: d => rescheduleSheet(d.id),
  newStudent: () => studentForm(),
  editStudent: d => studentForm(d.id),
  openStudent: d => studentSheet(d.id),
  payStudent: d => paySheet(d.id, d.m),
  compose: d => composeSheet(d.id, d.sid),
